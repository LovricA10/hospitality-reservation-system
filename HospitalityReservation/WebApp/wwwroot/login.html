<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-container {
            width: 300px;
            padding: 20px;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
            margin: 80px auto;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input[type=text], input[type=password] {
            width: 100%;
            padding: 8px 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #eef3fb;
        }

        button {
            width: 100%;
            background-color: #212529;
            color: white;
            padding: 10px;
            margin-top: 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

            button:hover {
                background-color: #343a40;
            }

        .link {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            font-size: 13px;
        }

            .link a {
                color: #0d6efd;
                text-decoration: none;
                font-weight: bold;
            }

                .link a:hover {
                    text-decoration: underline;
                }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>

        <label for="username"><b>Email</b></label>
        <input type="text" placeholder="Enter Username" name="username" id="username" required>

        <label for="password"><b>Password</b></label>
        <input type="password" placeholder="Enter Password" name="password" id="password" required>

        <button onclick="jwtLogin()">Login</button>

        <div class="error" id="errorMsg"></div>

        <div class="link">
            <a href="register.html">Register new account</a>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script>
        const loginUrl = "http://localhost:5127/api/User/Login";

        function jwtLogin() {
            const loginData = {
                email: $("#username").val(),
                password: $("#password").val()
            };

            $.ajax({
                method: "POST",
                url: loginUrl,
                data: JSON.stringify(loginData),
                contentType: 'application/json'
            }).done(function (tokenData) {
                localStorage.setItem("JWT", tokenData);
                window.location.href = "logs.html";
            }).fail(function (err) {
                $("#errorMsg").text("Login failed: " + err.responseText);
                localStorage.removeItem("JWT");
            });
        }
    </script>
</body>
</html>
